name: Build APK - Changeur de Voix

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Creer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verifier fichiers
        run: |
          ls -la
          ls -la images/
          test -f index.html && echo "index.html OK"
          test -f images/icon.png && echo "icon.png OK"
          test -f images/splash.png && echo "splash.png OK"

      - name: Creer projet Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          mkdir -p www/images
          cp images/icon.png www/images/icon.png
          cp images/splash.png www/images/splash.png
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Changeur de Voix" com.kibwe.changeurdevoix --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Changeur-de-Voix-by-KIBWE-ZONGWE-Israel.apk
          ls -lh *.apk

      - name: Uploader APK
        uses: actions/upload-artifact@v4
        with:
          name: Changeur-de-Voix-APK
          path: Changeur-de-Voix-by-KIBWE-ZONGWE-Israel.apk
          if-no-files-found: error
