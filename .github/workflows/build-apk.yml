name: Creer APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Creer APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verifier SDK Android deja installe
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la /usr/lib/android-sdk/
          ls -la $ANDROID_HOME/platform-tools/ | head -20
          java -version
          sdkmanager --version || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version

      - name: Fichiers de verification
        run: |
          ls -la
          ls -la images/
          test -f index.html && echo "index.html OK"
          test -f images/icon.png && echo "icon.png OK"
          test -f images/splash.png && echo "splash.png OK"

      - name: Projet Creer Condensateur
        run: |
          mkdir -p www
          cp index.html www/index.html
          mkdir -p www/images
          cp images/icon.png www/images/icon.png
          cp images/splash.png www/images/splash.png
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Changeur de Voix" com.kibwe.changeurdevoix --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Debogage de la generation de l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renommer APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Changeur-de-Voix-by-KIBWE-ZONGWE-Israel.apk
          ls -lh *.apk

      - name: APK de telechargement
        uses: actions/upload-artifact@v4
        with:
          name: Changeur-de-Voix-APK
          path: Changeur-de-Voix-by-KIBWE-ZONGWE-Israel.apk
          if-no-files-found: error
